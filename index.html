<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador ALND FF</title>
<style>
*{box-sizing:border-box;font-family:sans-serif;margin:0;padding:0}
body{background:linear-gradient(135deg,#050a30,#0f1742);color:white;padding:24px;min-height:100vh}
.titulo{font-size:38px;color:#3b82f6;text-align:center;font-weight:bold;margin-bottom:24px;text-shadow:0 0 10px #3b82f6}
.caixa{background:rgba(15,23,60,0.75);backdrop-filter:blur(10px);border:1px solid #2563eb;border-radius:20px;padding:28px;box-shadow:0 0 20px #1e40af40}
.botao{width:100%;padding:16px;margin:10px 0;border:none;border-radius:12px;font-weight:bold;font-size:15px;transition:0.2s ease}
.botao.azul{background:#2563eb;color:white}
.botao.verde{background:#16a34a;color:white}
.botao.laranja{background:#f59e0b;color:#111}
input, select{width:100%;padding:14px;border-radius:12px;border:none;margin:8px 0 18px;color:#111;font-size:15px}
#resultado{margin-top:24px;padding:18px;background:rgba(30,64,175,0.35);border-radius:14px;border:1px solid #3b82f6}

/* Bolinha flutuante grande */
#bolinhaFF{position:fixed;bottom:110px;right:22px;width:85px;height:85px;background:#2563eb;color:white;border:none;border-radius:50%;box-shadow:0 0 20px #2563eb;z-index:999;font-size:20px;font-weight:bold}
#menuBolinha{position:fixed;bottom:220px;right:22px;display:flex;flex-direction:column;gap:12px;z-index:998;display:none}
.btnMenu{padding:13px;width:150px;border:none;border-radius:10px;font-weight:bold;color:white}
.btnTravar{background:#1e40af}
.btnAbrirFF{background:#16a34a}
</style>
</head>
<body>
<div class="titulo">ALND GERADOR FF</div>
<div class="caixa">
  <p style="font-size:16px;margin-bottom:8px;">1. Sistema Operacional</p>
  <select id="sistema">
    <option value="Android">Android</option>
    <option value="iOS">iPhone</option>
  </select>

  <p style="font-size:16px;margin-bottom:8px;">2. Digite a marca do aparelho</p>
  <input type="text" id="marcaInput" placeholder="Ex: Samsung, Redmi, Motorola">

  <p style="font-size:16px;margin-bottom:8px;">3. Digite o modelo</p>
  <input type="text" id="modeloInput" placeholder="Ex: A05s, A15, 18 Pro Max">

  <p style="font-size:16px;margin-bottom:8px;">4. Nível de sensibilidade</p>
  <select id="nivelSensi">
    <option value="baixa">Baixa</option>
    <option value="media">Média</option>
    <option value="alta">Alta (até 180)</option>
  </select>

  <button class="botao azul" id="btnGerar">GERAR SENSIBILIDADE</button>
  <button class="botao azul">GUIA TRAVAR 60FPS</button>
  <button class="botao azul">OTIMIZAÇÃO GERAL</button>
  <button class="botao laranja">ATIVAR OTIMIZAÇÃO</button>
  <button class="botao verde">ABRIR FREE FIRE</button>

  <div id="resultado"></div>
</div>

<!-- Bolinha e botões -->
<button id="bolinhaFF">FF</button>
<div id="menuBolinha">
  <button class="btnMenu btnTravar" id="btnTravar">TRAVAR BOTÃO</button>
  <button class="btnMenu btnAbrirFF" id="btnAbrirFF">ABRIR FS DIRETO</button>
</div>

<script>
const bolinha = document.getElementById('bolinhaFF');
const menu = document.getElementById('menuBolinha');
const btnTravar = document.getElementById('btnTravar');
const btnFF = document.getElementById('btnAbrirFF');
const btnGerar = document.getElementById('btnGerar');
const resultado = document.getElementById('resultado');
let menuAberto = false;

bolinha.addEventListener('click', () => {
  menuAberto = !menuAberto;
  menu.style.display = menuAberto ? 'flex' : 'none';
})

btnTravar.addEventListener('click', () => {
  alert('✅ Botão travado com sucesso!');
})

btnFF.addEventListener('click', () => {
  window.location.href = 'intent://com.dts.freefireth/#Intent;scheme=vnd.android.package;package=com.dts.freefireth;end';
})

btnGerar.addEventListener('click', () => {
  resultado.innerHTML = `<p>🎯 Sensibilidade gerada para o seu aparelho, ajuste a puxada de capa dentro do Free Fire</p>`
})
</script>
</body>
</html>
